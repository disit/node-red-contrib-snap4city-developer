<script type="text/javascript">
    RED.nodes.registerType("delegate-group-to-user", {
        category: "S4CGroup",
        color: "#a6a7cf",
        defaults: {
            name: {
                value: ""
            },
            usernameDelegated: {
                value: ""
            },
            groupId: {
                value: ""
            },
            groupDataList: {
                value: "[]"
            },
            selectedGroupDataId: {
                value: ""
            },
            authentication: {
                type: "snap4city-authentication",
                required: false
            }
        },
        outputs: 1,
        inputs: 1,
        icon: "white-globe.png",
        label: function () {
            return this.name || "delegate group to user";
        },
        oneditprepare: function () {
            $("#node-input-currentNodeId").val(this.id);
            $("#node-input-groupId").val("");

            var accessToken = "";
            var groupDataList = "";

            $.ajax({
                url: "retrieveAccessTokenAuthenticationDev",
                type: "POST",
                async: false,
                dataType: "json",
                data: {
                    authenticationNodeId: $("#node-input-authentication").val(),
                    nodeId: $("#node-input-currentNodeId").val()
                },
                success: function (_data) {
                    if (_data.accessToken === "") {
                        $("#selectGroupContainer").hide();
                        $("#tipAuthenticationWrong").show();
                        $("#tipAuthentication").hide();
                    } else {
                        accessToken = _data.accessToken;
                    }
                }
            });

            refreshGroupSelection(accessToken, groupDataList);
        },
        oneditsave: function () {
            $("#node-input-selectedGroupDataId").val($("#node-input-groupId").val());
            $("#node-input-name").val("Delegate group to user");
        }
    });

    var refreshGroupSelection = function (accessToken, groupDataList) {
        if (groupDataList !== "") {
            createGroupSelection(groupDataList);
        } else if (accessToken !== "") {
            $.ajax({
                url: "myPersonalDataUrl",
                type: "GET",
                async: false,
                success: function (_data) {
                    var authenticationNode = RED.nodes.node($("#node-input-authentication").val());
                    var domain = authenticationNode !== null ? authenticationNode.domain : "";

                    if (domain !== "") {
                        _data.myPersonalDataUrl = domain.replace(/\/$/, "") + "/mypersonaldata/api/v1/";
                    } else {
                        _data.myPersonalDataUrl = _data.myPersonalDataUrl.replace(
                            /\/datamanager\/api\/v1\/?$/,
                            "/mypersonaldata/api/v1/"
                        );
                    }

                    $.ajax({
                        url: _data.myPersonalDataUrl +
                            "devicegroup/?sourceRequest=grpeditor&accessToken=" +
                            accessToken,
                        type: "GET",
                        async: true,
                        dataType: "json",
                        success: function (_data) {
                            createGroupSelection(_data);
                        },
                        error: function (err) {
                            console.log(err);
                        }
                    });
                }
            });
        }
    };

    var createGroupSelection = function (currentGroupDataList) {
        $("#node-input-groupDataList").val(JSON.stringify(currentGroupDataList));

        if (currentGroupDataList.length !== 0) {
            $("#node-input-groupId").empty();
            var currentValue = $("#node-input-selectedGroupDataId").val();

            for (var i = 0; i < currentGroupDataList.length; i++) {
                $("<option value='" + currentGroupDataList[i].id + "'>" +
                    currentGroupDataList[i].name + "</option>")
                    .appendTo($("#node-input-groupId"));
            }

            $("#node-input-groupId").val(currentValue);
        }
    };
</script>

<script type="text/x-red" data-template-name="delegate-group-to-user">
    <input type="hidden" id="node-input-name">
    <input type="hidden" id="node-input-currentNodeId">
    <input type="hidden" id="node-input-selectedGroupDataId">
    <input type="hidden" id="node-input-groupDataList">

    <div class="form-row" id="rowAuthentication">
        <label for="node-input-authentication">Authentication</label>
        <input type="text" id="node-input-authentication">
    </div>

    <div class="form-row" id="usernameDelegatedContainer">
        <label for="node-input-usernameDelegated">
            <i class="fa fa-user"></i>Username
        </label>
        <input type="text" id="node-input-usernameDelegated" placeholder="username delegated" style="width: 55%;">
    </div>

    <div class="form-row" id="selectGroupContainer">
        <label for="node-input-groupId">
            <i class="fa fa-object-group"></i>Select Group
        </label>
        <select id="node-input-groupId" style="width: 55%;"></select>
    </div>

    <div class="form-tips" id="tipAuthentication" style="max-width: none">
        You must have an account with Snap4city to use this node. You can register for one
        <a href="https://www.snap4city.org" target="_blank">here</a>.
    </div>
    <div class="form-tips" id="tipAuthenticationWrong" style="display:none; max-width: none">
        Maybe the authentication data are wrong. Check them and redeploy the node.
    </div>
</script>

<script type="text/x-red" data-help-name="delegate-group-to-user">
    <p>Delegates a device group to a Snap4City user.</p>

    <h3>Inputs</h3>
    <p>The node accepts a JSON object in <code>msg.payload</code> with these optional parameters:</p>

    <dl class="message-properties">
        <dt>groupId
            <span class="property-type">number</span>
        </dt>
        <dd>The ID of the group to delegate.</dd>

        <dt>usernameDelegated
            <span class="property-type">string</span>
        </dt>
        <dd>The username receiving the group delegation.</dd>
    </dl>

    <p>Values provided in <code>msg.payload</code> override the values configured in the node.</p>

    <pre>
{
    "groupId": number,
    "usernameDelegated": "username"
}
    </pre>

    <h3>Outputs</h3>
    <p>Returns the API response in <code>msg.payload</code>.</p>
</script>
